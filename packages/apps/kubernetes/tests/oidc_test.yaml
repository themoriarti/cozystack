          value:
            - "--feature-gates=kube:Foo=true"
            - "--feature-gates="
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
            - "--feature-gates=kube:RemoteRequestHeaderUID=true"
        documentIndex: 1

  - it: reads a capitalised gate value as ownership on v1.32
    # strconv.ParseBool accepts True, TRUE, T and t alongside true, so the
    # chart accepts exactly those spellings. Comparing against true alone would
    # read this as no opinion and merge a term the gate already has.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.32"
      controlPlane.apiServer.extraArgs:
        - "--feature-gates=RemoteRequestHeaderUID=True"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--feature-gates=RemoteRequestHeaderUID=True"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1

  - it: reads a single-letter t gate value as ownership on v1.32
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.32"
      controlPlane.apiServer.extraArgs:
        - "--feature-gates=RemoteRequestHeaderUID=t"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--feature-gates=RemoteRequestHeaderUID=t"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1

  - it: does not read a mixed-case gate value as an opinion on v1.32
    # strconv.ParseBool rejects tRuE, so the apiserver never enables the gate on
    # it. Folding case before the match would read it as ownership and withhold
    # the chart's own term.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.32"
      controlPlane.apiServer.extraArgs:
        - "--feature-gates=RemoteRequestHeaderUID=tRuE"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--feature-gates=RemoteRequestHeaderUID=tRuE"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
            - "--feature-gates=RemoteRequestHeaderUID=true"
        documentIndex: 1

  - it: reads a capitalised F gate value as an opt-out from v1.33 on
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.34"
      controlPlane.apiServer.extraArgs:
        - "--feature-gates=RemoteRequestHeaderUID=F"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--feature-gates=RemoteRequestHeaderUID=F"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: adds nothing on v1.32 when AllAlpha=false is the only entry
    # The plain half of the v1.32 blanket opt-out. The failing combination below
    # covers it only when the operator also brings a header flag; on its own the
    # opt-out has to render exactly what it rendered before this code existed.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.32"
      controlPlane.apiServer.extraArgs:
        - "--feature-gates=AllAlpha=false"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--feature-gates=AllAlpha=false"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: names the emulated version in the opt-out message when emulation decided it
    # The message is the migration instruction, so it has to name the version the
    # decision was taken at rather than the image tag.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.35"
      controlPlane.apiServer.extraArgs:
        - "--emulated-version=1.32"
        - "--feature-gates=RemoteRequestHeaderUID=false"
        - "--requestheader-uid-headers=X-Remote-Uid"
    asserts:
      - failedTemplate:
          errorMessage: 'controlPlane.apiServer.extraArgs contains "--requestheader-uid-headers=X-Remote-Uid" alongside "--feature-gates=RemoteRequestHeaderUID=false", while spec.oidc.mode is "System" on Kubernetes v1.35 emulating 1.32 — the kube-apiserver rejects a --requestheader-uid-headers list while RemoteRequestHeaderUID is disabled, so the control plane would refuse to start. Drop one of the two: your header flag, or the gate setting that turns RemoteRequestHeaderUID off.'

  - it: fails on v1.32 when an AllAlpha=false opt-out meets the operator's own header flag
    # The v1.32 half of the surviving gate guard: the blanket opt-out leaves
    # RemoteRequestHeaderUID off, and Validate() rejects a non-empty
    # --requestheader-uid-headers list while it is off. The chart cannot fix
    # this by withholding its own flag, because the offending list is the
    # operator's.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.32"
      controlPlane.apiServer.extraArgs:
        - "--feature-gates=AllAlpha=false"
        - "--requestheader-uid-headers=X-Remote-Uid"
    asserts:
      - failedTemplate:
          errorMessage: 'controlPlane.apiServer.extraArgs contains "--requestheader-uid-headers=X-Remote-Uid" alongside "--feature-gates=AllAlpha=false", while spec.oidc.mode is "System" on Kubernetes v1.32 — the kube-apiserver rejects a --requestheader-uid-headers list while RemoteRequestHeaderUID is disabled, so the control plane would refuse to start. Drop one of the two: your header flag, or the gate setting that turns RemoteRequestHeaderUID off.'

  ###############################################
  # mode: System — bootstrap Job + users[]      #
  ###############################################

  - it: System mode renders the bootstrap Job with the policy.cozystack label
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-rbac-job.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      oidc.users:
        - email: alice@example.org
          role: admin
    asserts:
      # ServiceAccount (0), Role (1), RoleBinding (2), Job bootstrap (3), Job cleanup (4)
      - isKind:
          of: Job
        documentIndex: 3
      - equal:
          path: metadata.name
          value: kubernetes-app-oidc-bootstrap
        documentIndex: 3
      - equal:
          path: spec.template.metadata.labels["policy.cozystack.io/allow-to-apiserver"]
          value: "true"
        documentIndex: 3

  - it: bootstrap Job command builds a CRB for each users[] entry
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-rbac-job.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      oidc.users:
        - email: alice@example.org
          role: admin
        - email: bob@example.org
          role: view
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'name: "alice@example.org"'
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'name: "bob@example.org"'
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'name: cluster-admin'
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'name: view'
        documentIndex: 3

  ###############################################
  # mode: CustomConfig                          #
  ###############################################

  - it: CustomConfig mode writes the operator-supplied AuthenticationConfiguration verbatim
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-authn-config.yaml
    set:
      _cluster.oidc-enabled: "false"
      oidc.mode: CustomConfig
      oidc.customConfig.config: |
        apiVersion: apiserver.config.k8s.io/v1beta1
        kind: AuthenticationConfiguration
        jwt:
        - issuer:
            url: https://idp.example.com
            audiences: [my-cluster]
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kubernetes-app-oidc-authn-config
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "url: https://idp.example.com"
      # Verbatim means verbatim: the uid mapping System mode renders must not
      # be grafted onto a configuration the operator owns.
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: 'uid:'

  - it: CustomConfig mode with secretRef does not emit a chart-owned Secret
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-authn-config.yaml
    set:
      _cluster.oidc-enabled: "false"
      oidc.mode: CustomConfig
      oidc.customConfig.secretRef.name: my-byo-authn
    asserts:
      - hasDocuments:
          count: 0

  - it: CustomConfig mode with secretRef mounts the tenant-supplied Secret on the KCP
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      oidc.mode: CustomConfig
      oidc.customConfig.secretRef.name: my-byo-authn
    asserts:
      - equal:
          path: spec.deployment.extraVolumes[2].secret.secretName
          value: my-byo-authn
        documentIndex: 1

  - it: CustomConfig mode does not pre-render the OIDC kubeconfig Secret
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-kubeconfig-secret.yaml
    set:
      oidc.mode: CustomConfig
      oidc.customConfig.config: "..."
    asserts:
      - hasDocuments:
          count: 0

  - it: CustomConfig mode does not render any Keycloak objects
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-keycloak.yaml
    set:
      oidc.mode: CustomConfig
      oidc.customConfig.config: "..."
    capabilities:
      apiVersions:
        - v1.edp.epam.com/v1
    asserts:
      - hasDocuments:
          count: 0

  - it: CustomConfig mode fails when neither config nor secretRef is supplied
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-authn-config.yaml
    set:
      oidc.mode: CustomConfig
    asserts:
      - failedTemplate:
          errorMessage: "spec.oidc.mode: CustomConfig requires either spec.oidc.customConfig.config (inline AuthenticationConfiguration) or spec.oidc.customConfig.secretRef.name (Secret with config.yaml key)."

  - it: CustomConfig mode rejects setting both config and secretRef
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-authn-config.yaml
    set:
      oidc.mode: CustomConfig
      oidc.customConfig.config: "..."
      oidc.customConfig.secretRef.name: my-byo
    asserts:
      - failedTemplate:
          errorMessage: "spec.oidc.customConfig: set exactly one of `config` (inline) or `secretRef.name` — they are mutually exclusive."

  # The managed cluster's apiserver trusts the platform Keycloak realm, whose
  # name is driven by _cluster.oidc-realm-name (authentication.oidc.realmName in
  # the platform). A renamed realm must reach the AuthenticationConfiguration
  # issuer, or the guest apiserver rejects every token the platform mints.
  - it: System mode threads a custom realm name into the issuer
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-authn-config.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      _cluster.oidc-realm-name: acme
      oidc.mode: System
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "url: https://keycloak.example.org/realms/acme"
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: "/realms/cozy"
      # The claimValidationRules denial message names the realm; on a renamed
      # realm it must not keep telling the user to look in "cozy".
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "group in the acme realm"
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: "group in the cozy realm"
