suite: tenant kube-apiserver OIDC (Phase 1)

values:
  - values/common.yaml

# In cluster.yaml the KamajiControlPlane is document index 1
# (0: Cluster, 1: KamajiControlPlane, 2: WorkloadMonitor, 3: KubevirtCluster, ...).
# Documents at higher indices are KubevirtMachineTemplate, MachineDeployment,
# MachineHealthCheck, WorkloadMonitor per node group.

tests:
  ###############################################
  # default: oidc.mode=None renders nothing     #
  ###############################################

  - it: emits no OIDC apiserver flag when oidc.mode is None
    # extraArgs is always rendered (see apiserver_authentication_test — the
    # explicit `[]` is required so a mode=System → mode=None upgrade REPLACES
    # the previously-set `--authentication-config` flag on the CRD).
    release:
      name: test
      namespace: tenant-test
    template: templates/cluster.yaml
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value: []
        documentIndex: 1

  - it: emits no chart-managed OIDC volume on the KamajiControlPlane when oidc.mode is None
    release:
      name: test
      namespace: tenant-test
    template: templates/cluster.yaml
    asserts:
      - lengthEqual:
          path: spec.deployment.extraVolumes
          count: 2
        documentIndex: 1

  - it: emits no Keycloak objects when oidc.mode is None
    release:
      name: test
      namespace: tenant-test
    template: templates/oidc-keycloak.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: emits no AuthenticationConfiguration Secret when oidc.mode is None
    release:
      name: test
      namespace: tenant-test
    template: templates/oidc-authn-config.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders bootstrap Job + KCP-normalizer scaffolding even when oidc.mode is None
    # The Job is always rendered (SA + Role + RoleBinding + Job) so the mode=None
    # branch of the script can force-clean the KamajiControlPlane's stale
    # `authentication-config` volume that Kamaji's SSA field-ownership prevents
    # Helm from removing. When mode=None the script skips the CRB+Secret
    # branches after issuing the normalizing `kubectl patch`.
    release:
      name: test
      namespace: tenant-test
    template: templates/oidc-rbac-job.yaml
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: kind
          value: ServiceAccount
        documentIndex: 0
      - equal:
          path: kind
          value: Job
        documentIndex: 3
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'if \[ "\$OIDC_MODE" = "None" \]'
        documentIndex: 3

  - it: emits no OIDC kubeconfig placeholder Secret when oidc.mode is None
    release:
      name: test
      namespace: tenant-test
    template: templates/oidc-kubeconfig-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  ###############################################
  # existing customer upgrade — vestigial fields #
  ###############################################

  - it: mode=None emits empty extraArgs so a System→None downgrade replaces the live array
    # Guards against the Helm+CRD JSON-merge-patch pitfall — see cluster.yaml.
    # If a customer previously set oidc.mode=System, the KCP got
    # `--authentication-config` in extraArgs. Toggling mode=None must emit an
    # empty `extraArgs: []` so the patch REPLACES the stale value. Silently
    # omitting extraArgs would leave the live CRD unchanged and the tenant
    # apiserver would keep the dangling flag.
    release:
      name: test
      namespace: tenant-test
    template: templates/cluster.yaml
    set:
      oidc.mode: None
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value: []
        documentIndex: 1
      - equal:
          path: spec.apiServer.extraVolumeMounts
          value: []
        documentIndex: 1
      # deployment.extraVolumes always has the two chart-owned Talos volumes;
      # the OIDC volume must NOT be there in mode=None.
      - lengthEqual:
          path: spec.deployment.extraVolumes
          count: 2
        documentIndex: 1

  - it: unknown fields under oidc are silently ignored (existing customer upgrade path)
    release:
      name: test-legacy
      namespace: tenant-test
    template: templates/oidc-rbac-job.yaml
    set:
      # An existing CR carried over from an earlier OIDC API surface may still
      # have the old `oidc.enabled: bool` field. The Phase-1 chart only reads
      # `oidc.mode`; the vestigial field is silently ignored and mode defaults
      # to None — the Job renders in normalize-only mode (no CRBs, no Secret
      # patch, KCP volume cleanup only).
      oidc.enabled: true
    asserts:
      - hasDocuments:
          count: 4
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'if \[ "\$OIDC_MODE" = "None" \]'
        documentIndex: 3

  ###############################################
  # mode: System — happy path                   #
  ###############################################

  - it: System mode renders the per-cluster KeycloakClient
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-keycloak.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
    capabilities:
      apiVersions:
        - v1.edp.epam.com/v1
    asserts:
      - isKind:
          of: KeycloakClient
        documentIndex: 1
      - equal:
          path: spec.clientId
          value: tenant-foo-kubernetes-app
        documentIndex: 1
      - equal:
          path: spec.public
          value: true
        documentIndex: 1
      - equal:
          path: spec.realmRef.name
          value: keycloakrealm-cozy
        documentIndex: 1
      - equal:
          path: spec.realmRef.kind
          value: ClusterKeycloakRealm
        documentIndex: 1
      - equal:
          path: spec.attributes["pkce.code.challenge.method"]
          value: S256
        documentIndex: 1
      - contains:
          path: spec.redirectUris
          content: "http://localhost:8000"
        documentIndex: 1
      - contains:
          path: spec.redirectUris
          content: "http://localhost:18000"
        documentIndex: 1

  - it: System mode renders the per-cluster KeycloakClientScope with audience mapper
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-keycloak.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
    capabilities:
      apiVersions:
        - v1.edp.epam.com/v1
    asserts:
      - isKind:
          of: KeycloakClientScope
        documentIndex: 0
      - equal:
          path: spec.name
          value: tenant-foo-kubernetes-app-audience
        documentIndex: 0
      - equal:
          path: spec.protocolMappers[0].protocolMapper
          value: oidc-audience-mapper
        documentIndex: 0
      - equal:
          path: spec.protocolMappers[0].config["included.client.audience"]
          value: tenant-foo-kubernetes-app
        documentIndex: 0

  - it: System mode skips Keycloak objects when the operator CRDs are absent
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-keycloak.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
    asserts:
      - hasDocuments:
          count: 0

  - it: System mode renders the AuthenticationConfiguration Secret with the cozy issuer
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-authn-config.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kubernetes-app-oidc-authn-config
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "url: https://keycloak.example.org/realms/cozy"
      # Verified end-to-end on dev3: cozy realm's preferred_username is the
      # Keycloak *username* (not the email), so a CRB subject sourced from
      # users[].email would silently mis-authenticate. Lock the claim name.
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "claim: email"
      # Without a uid mapping upstream hands the user an empty UID, and the
      # X-Remote-Uid header the chart publishes carries nothing across the
      # aggregation layer. `sub` survives the email change the platform realm
      # permits, which the username claim does not.
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'uid:\s+claim: sub'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "- tenant-foo-kubernetes-app"
      # Cross-tenant isolation gate — the AuthenticationConfiguration
      # must carry a CEL claimValidationRule keyed on the release's
      # tenant-scoped groups. Without this rule, any authenticated
      # cozy-realm user would land at `system:authenticated` on this
      # tenant's apiserver and get discovery access. See
      # kubernetes.oidc.groupsClaimValidationExpr in _helpers.tpl.
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "claimValidationRules:"
      # The groups range MUST be wrapped in dyn(): claims.groups is statically
      # `any`, and the apiserver rejects a comprehension over `any` at startup
      # (CrashLoop). Pinning dyn() here makes a regression fail the unit suite
      # instead of only surfacing on a live apiserver. Verified on dev3 v1.32.
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'expression: .+has\(claims\.groups\).+dyn\(claims\.groups\)\.exists\(g, g in .+tenant-foo-view.+tenant-foo-use.+tenant-foo-admin.+tenant-foo-super-admin'
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: 'message: "user is not a member of any tenant-foo-\{view,use,admin,super-admin\} group'

  - it: System mode injects --authentication-config and the chart-owned volume into the KCP
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
    asserts:
      - contains:
          path: spec.apiServer.extraArgs
          content: "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1
      - contains:
          path: spec.apiServer.extraVolumeMounts
          content:
            name: authentication-config
            mountPath: /etc/kubernetes/authentication-config
            readOnly: true
        documentIndex: 1
      - lengthEqual:
          path: spec.deployment.extraVolumes
          count: 3
        documentIndex: 1
      - equal:
          path: spec.deployment.extraVolumes[2].name
          value: authentication-config
        documentIndex: 1
      - equal:
          path: spec.deployment.extraVolumes[2].secret.secretName
          value: kubernetes-app-oidc-authn-config
        documentIndex: 1

  - it: System mode pre-renders the OIDC kubeconfig Secret as a release-owned placeholder
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-kubeconfig-secret.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kubernetes-app-oidc-kubeconfig
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - matchRegex:
          path: stringData.kubeconfig
          pattern: "awaiting OIDC bootstrap Job"

  - it: System mode hard-fails when platform OIDC is off
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-keycloak.yaml
    set:
      _cluster.oidc-enabled: "false"
      _cluster.root-host: example.org
      oidc.mode: System
    asserts:
      - failedTemplate:
          errorMessage: "spec.oidc.mode: System requires the platform-level OIDC feature (authentication.oidc.enabled) — enable it in cozystack-values, or use mode: CustomConfig for a tenant-supplied issuer."

  - it: System mode hard-fails cleanly when _cluster map has no oidc-enabled key
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/oidc-keycloak.yaml
    set:
      _cluster: {}
      oidc.mode: System
    asserts:
      - failedTemplate:
          errorMessage: "spec.oidc.mode: System requires the platform-level OIDC feature (authentication.oidc.enabled) — enable it in cozystack-values, or use mode: CustomConfig for a tenant-supplied issuer."

  - it: fails when legacy --oidc-* flag collides with spec.oidc.mode
    # Regression guard: kube-apiserver refuses to boot when both
    # `--authentication-config` (chart-injected) and legacy `--oidc-*` flags
    # are set. Existing customers who configured OIDC by hand through the
    # `controlPlane.apiServer.extraArgs` passthrough would BOOT-FAIL on
    # upgrade the moment they toggle spec.oidc.mode. Fail render instead.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      controlPlane.apiServer.extraArgs:
        - "--oidc-issuer-url=https://legacy.example/realms/x"
        - "--oidc-client-id=legacy"
    asserts:
      - failedTemplate:
          errorMessage: 'controlPlane.apiServer.extraArgs contains "--oidc-issuer-url=https://legacy.example/realms/x" while spec.oidc.mode is "System" — the kube-apiserver refuses to boot with both --authentication-config (injected by spec.oidc) and legacy --oidc-* flags. Remove the --oidc-* flags from controlPlane.apiServer.extraArgs and use spec.oidc.mode: CustomConfig with a customConfig.config carrying the same issuer/audience if you need to override, or spec.oidc.mode: System for the platform cozy default.'

  - it: fails when an explicit --authentication-config collides with spec.oidc.mode
    # The chart injects this flag itself, and the tenant control plane keeps one
    # entry per flag name, so an operator copy either loses to the chart's or
    # displaces it. Guard predates the UID work but lives in the same arg loop,
    # so a future edit there must not drop it silently.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.34"
      controlPlane.apiServer.extraArgs:
        - "--authentication-config=/etc/kubernetes/other.yaml"
    asserts:
      - failedTemplate:
          errorMessage: 'controlPlane.apiServer.extraArgs contains "--authentication-config=/etc/kubernetes/other.yaml" while spec.oidc.mode is "System" — the chart already injects --authentication-config= for OIDC. Drop your explicit flag and let spec.oidc.mode: CustomConfig own the AuthenticationConfiguration (customConfig.config or customConfig.secretRef.name), or leave spec.oidc.mode: None and keep managing the flag yourself.'

  - it: allows legacy --oidc-* flags to remain when spec.oidc.mode is None
    # No collision when the chart is NOT injecting --authentication-config —
    # existing customers who manage OIDC by hand keep working until they
    # explicitly opt in to the new selector.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      oidc.mode: None
      controlPlane.apiServer.extraArgs:
        - "--oidc-issuer-url=https://legacy.example/realms/x"
    asserts:
      - contains:
          path: spec.apiServer.extraArgs
          content: "--oidc-issuer-url=https://legacy.example/realms/x"
        documentIndex: 1

  ###############################################
  # aggregation-layer UID headers               #
  ###############################################
  # An authenticated user's UID reaches an aggregated apiserver only when the
  # tenant kube-apiserver publishes `requestheader-uid-headers` into the
  # extension-apiserver-authentication ConfigMap. Every test below pins
  # `version` explicitly — common.yaml pins v1.32, and inheriting that pin
  # would silently change the meaning of a case if the pin ever moves.

  - it: v1.32 renders the uid header flag and the alpha feature gate
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.32"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
            - "--feature-gates=RemoteRequestHeaderUID=true"
        documentIndex: 1

  - it: v1.33 renders the uid header flag without the feature gate
    # RemoteRequestHeaderUID is beta and on by default from v1.33; rendering it
    # anyway would only collide with a user-supplied --feature-gates entry.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.33"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1
      - notContains:
          path: spec.apiServer.extraArgs
          content: "--feature-gates=RemoteRequestHeaderUID=true"
        documentIndex: 1

  - it: v1.35 renders the uid header flag without the feature gate
    # Pins the default enum value and the deny-list fall-through: a version the
    # chart has not heard of must land on the header-flag-only branch.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.35"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1

  - it: v1.31 renders neither the uid header flag nor the feature gate
    # --requestheader-uid-headers does not exist on v1.31 and an unknown flag is
    # fatal to the apiserver, so aggregated UID is unavailable there by upstream
    # limitation.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.31"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: CustomConfig mode gets the same uid header flag and gate as System
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      oidc.mode: CustomConfig
      oidc.customConfig.secretRef.name: my-byo-authn
      version: "v1.32"
    asserts:
      - contains:
          path: spec.apiServer.extraArgs
          content: "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1
      - contains:
          path: spec.apiServer.extraArgs
          content: "--feature-gates=RemoteRequestHeaderUID=true"
        documentIndex: 1

  - it: mode None renders no uid header flag on a version that supports it
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      oidc.mode: None
      version: "v1.33"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value: []
        documentIndex: 1

  - it: a user entry already carrying X-Remote-Uid suppresses the chart copy
    # The apiserver appends repeated entries of this flag, so the chart's own
    # element would be a duplicate here rather than a fix. The equal on the
    # full list proves it emitted none.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.33"
      controlPlane.apiServer.extraArgs:
        - "--requestheader-uid-headers=X-Remote-Uid"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--requestheader-uid-headers=X-Remote-Uid"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: adds its own element beside a uid-headers entry that omits X-Remote-Uid
    # Repeats of the flag append, so the apiserver validates the union and the
    # operator's own header keeps working beside the standard one. Rendering
    # both is what makes the list the apiserver would have refused acceptable.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.33"
      controlPlane.apiServer.extraArgs:
        - "--requestheader-uid-headers=X-Custom-Uid"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--requestheader-uid-headers=X-Custom-Uid"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1

  - it: a user uid-headers list containing X-Remote-Uid among others suppresses the chart copy
    # The realistic multi-header shape. X-Remote-Uid is present as its own
    # list element, which is what upstream requires, so the chart defers.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.33"
      controlPlane.apiServer.extraArgs:
        - "--requestheader-uid-headers=X-Remote-Uid,X-Extra-Uid"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--requestheader-uid-headers=X-Remote-Uid,X-Extra-Uid"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
        documentIndex: 1

  - it: does not read a uid-headers element that only looks like X-Remote-Uid
    # Upstream matches a whole list element, not a substring: X-Remote-Uid-Extra
    # does NOT satisfy the requirement. Reading it as the standard element would
    # suppress the chart's own and leave the apiserver with a list it refuses to
    # start on — a substring test would do exactly that.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.33"
      controlPlane.apiServer.extraArgs:
        - "--requestheader-uid-headers=X-Remote-Uid-Extra"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--requestheader-uid-headers=X-Remote-Uid-Extra"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1

  - it: does not read a space-padded X-Remote-Uid as the standard element
    # The flag is a pflag stringSlice and its CSV reader keeps surrounding
    # spaces, so upstream compares "X-Remote-Uid " against "X-Remote-Uid" and
    # finds no match. Reading that as the standard element would suppress the
    # chart's own and leave the apiserver with a list it refuses to start on.
    # Being more permissive than upstream is the one direction this reading
    # must never take.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.33"
      controlPlane.apiServer.extraArgs:
        - "--requestheader-uid-headers=X-Remote-Uid , Other"
    asserts:
      - equal:
          path: spec.apiServer.extraArgs
          value:
            - "--requestheader-uid-headers=X-Remote-Uid , Other"
            - "--authentication-config=/etc/kubernetes/authentication-config/config.yaml"
            - "--requestheader-uid-headers=X-Remote-Uid"
        documentIndex: 1

  - it: fails when a user uid-headers list carries a whitespace-only element
    # checkForWhiteSpaceOnly runs over the same list and refuses an element that
    # is empty after TrimSpace, so the X-Remote-Uid next to it does not save the
    # list, and nothing the chart adds repairs it either.
    release:
      name: kubernetes-app
      namespace: tenant-foo
    template: templates/cluster.yaml
    set:
      _cluster.oidc-enabled: "true"
      _cluster.root-host: example.org
      oidc.mode: System
      version: "v1.33"
      controlPlane.apiServer.extraArgs:
        - "--requestheader-uid-headers=X-Remote-Uid, "
    asserts:
      - failedTemplate:
          errorMessage: 'controlPlane.apiServer.extraArgs contains "--requestheader-uid-headers=X-Remote-Uid, " while spec.oidc.mode is "System" — the kube-apiserver rejects a uid-headers list with an empty or whitespace-only element, and it validates every entry of the flag as one list, so the control plane would refuse to start. Remove the empty element from your entry, or drop the entry.'

  - it: fails on an empty element in an earlier uid-headers entry
    # Repeats append, so the trailing comma in the first entry puts an empty
