##
## @section Common parameters
##

## @param {string} [host] - The hostname used to access tenant services (defaults to using the tenant name as a subdomain for its parent tenant host).
host: ""

## @param {bool} etcd - Deploy own Etcd cluster.
etcd: false

## @param {bool} monitoring - Deploy own Monitoring Stack.
monitoring: false

## @param {bool} tracingCentral - Opt into the shared-central tracing topology: allow this tenant's OTLP collector to export traces to the shared VictoriaTraces in tenant-root instead of a per-tenant backend. Spans land in an account derived from the tenant's namespace name and UID (a namespace restored from backup, like a re-created one, gets a new account and no longer reads the spans stored before), and the tenant's Grafana reads them through a vmauth in tenant-root that pins that account, so tenants sharing the store cannot read each other's traces; tenant-root, and whoever it admits to its Grafana, are inside the store's trust boundary (see tracingCentralHost on its Monitoring). This single switch drives the whole topology: it renders two narrow Cilium egress rules (the collector and Grafana, each to the tenant-root vmauth, which logs them in as this tenant) AND tells the tenant's Monitoring stack to use the shared store, through a value the Monitoring application cannot set itself, so the export and the network path cannot diverge. Right after it is turned on, or after the tenant's traces-central-credentials Secret is re-created with a new password, spans the collector sends before the tenant-root vmauth has loaded the tenant's new login are refused with 401, which the collector does not retry, so those spans are dropped. Prerequisite: tenant-root must host the shared store, by setting `tracingCentralHost: true` in its Monitoring with a tracingStorages entry named `generic` in `cluster` mode, which is what makes it run that vmauth; without it the tenant's monitoring-system HelmRelease, which the platform operator can read, fails to render with a message naming this prerequisite, rather than the collector dropping every span. Switching a tenant that has a local backend to central keeps that backend and its datasource, so earlier traces stay readable; new spans go to the shared store, and the tenant removes the local entry from its Monitoring application when it no longer needs it. Turning it off again removes the tenant's login to the shared store: the spans it wrote there stay until the store's retention drops them and cannot be read from the tenant while it is off, and turning it on again on the same namespace makes them readable again. Spans the collector sends between turning it off and its Monitoring switching the collector back may be dropped, since the egress rule to the shared store is removed first. Deleting the tenant also leaves its spans until retention drops them; a tenant re-created under the same name gets a new account and does not read them. This needs the tenant's own Monitoring (`monitoring: true`): with the parent's Monitoring the switch does nothing. The default per-tenant backend additionally keeps trace data inside the tenant namespace; see design-proposals/distributed-tracing in cozystack/community.
tracingCentral: false

## @param {bool} ingress - Deploy own Ingress Controller.
ingress: false

## @param {bool} [gateway] - Deploy own Gateway API Gateway (backed by Cilium Gateway API controller). When unset (the default) or set to `false`, the tenant does not own a Gateway and instead publishes through the nearest ancestor tenant that owns one, regardless of whether `host` is empty or custom (`false` currently behaves the same as unset and does not opt out of that inheritance). Set to `true` to give the tenant its own Gateway with its own LoadBalancer IP and Certificate. A tenant with a custom (non-derived) `host` that needs its apex publicly reachable must set `true` explicitly, because an ancestor's TLS certificate does not cover a custom apex. Note: leave the key absent (do not write `gateway: null`): the chart distinguishes "unset" via missing-key, not via null value, to satisfy the JSON schema generated from this comment.

## @param {string} [gatewayClass] - GatewayClass for this tenant's own Gateway. Empty uses the platform default (`gateway.className`). Only the classes the operator lists in the platform's `gateway.tenantSelectableClasses`, plus that default, may be named here — anything else fails this tenant's own gateway release and reaches no other tenant. Read only when this tenant owns a Gateway; an inheriting tenant uses its ancestor's. Whether a class terminates TLS itself or at its provider's edge is declared once per class on the platform, not here.
gatewayClass: ""

## @param {bool} seaweedfs - Deploy own SeaweedFS.
seaweedfs: false

## @param {bool} computeplane - Deploy own ComputePlane — a single-tenant, Cozystack-managed cluster for untrusted-code applications. The tenant receives no admin kubeconfig for it. Automatic routing of catalog applications onto it (placement: ComputePlane) is a planned follow-up and is not available yet; until it lands, external catalogs target the cluster via its computeplane-cluster-admin-kubeconfig Secret. See design-proposals/compute-plane in cozystack/community.
computeplane: false

## @param {string} [schedulingClass] - The name of a SchedulingClass CR to apply scheduling constraints for this tenant's workloads.
schedulingClass: ""

## @param {map[string]quantity} resourceQuotas - Define resource quotas for the tenant.
resourceQuotas: {}
