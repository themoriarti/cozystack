suite: old TalosConfigTemplates are pruned, and only this pool's
# Every machineconfig change names a new TalosConfigTemplate and leaves the old
# one behind. Its ownerReferences (KamajiControlPlane, plus the Cluster CAPI
# adds) outlive every revision of the pool, so nothing reaps it on its own. The
# render lists this pool's templates that no MachineSet or MachineDeployment
# references; the Job prunes them, and its Role may delete those names and the
# current one, nothing else.
#
# What must never be pruned: a template something still references (a retained
# MachineSet is what a rollback returns to), the current one, a sibling pool's
# (pool "md0" must not match "md0-a1b2c3" by prefix), and another cluster's.
# The fake cluster below plants one of each. The specs are dummies: the
# selection reads only names, labels, ownerReferences and configRefs.
templates:
  - templates/talos-reconcile-job.yaml
release:
  name: kubernetes-nodes-myk8s-md0
  namespace: tenant-test
set:
  cluster: myk8s
  _cluster:
    cluster-domain: cozy.local
  version: "v1.35"
  minReplicas: 0
  maxReplicas: 3
  instanceType: ""
  diskSize: 20Gi
  storageClass: replicated
  roles:
    - ingress-nginx
  resources:
    cpu: "2"
    memory: 4Gi
tests:
  - it: prunes only this pool's unreferenced templates
    kubernetesProvider:
      scheme: &scheme
        "cluster.x-k8s.io/v1beta1/MachineSet":
          gvr:
            group: "cluster.x-k8s.io"
            version: "v1beta1"
            resource: "machinesets"
          namespaced: true
        "cluster.x-k8s.io/v1beta1/MachineDeployment":
          gvr:
            group: "cluster.x-k8s.io"
            version: "v1beta1"
            resource: "machinedeployments"
          namespaced: true
        "bootstrap.cluster.x-k8s.io/v1alpha3/TalosConfigTemplate":
          gvr:
            group: "bootstrap.cluster.x-k8s.io"
            version: "v1alpha3"
            resource: "talosconfigtemplates"
          namespaced: true
      objects:
        # The live MachineDeployment still points at a template the render is
        # about to replace: kept.
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: kubernetes-myk8s-md0, namespace: tenant-test}
          spec:
            template:
              spec:
                bootstrap:
                  configRef: {kind: TalosConfigTemplate, name: kubernetes-myk8s-md0-555555}
        # The retained MachineSet still holds the pre-content-naming template,
        # another the previous hashed one: both kept.
        - kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: kubernetes-myk8s-md0-old, namespace: tenant-test}
          spec:
            template:
              spec:
                bootstrap:
                  configRef: {kind: TalosConfigTemplate, name: kubernetes-myk8s-md0}
        - kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: kubernetes-myk8s-md0-prev, namespace: tenant-test}
          spec:
            template:
              spec:
                bootstrap:
                  configRef: {kind: TalosConfigTemplate, name: kubernetes-myk8s-md0-111111}
        # A MachineSet bootstrapped from a data secret carries no configRef.
        - kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: kubernetes-myk8s-static, namespace: tenant-test}
          spec:
            template:
              spec:
                bootstrap:
                  dataSecretName: static-bootstrap
        - &tct
          kind: TalosConfigTemplate
          apiVersion: bootstrap.cluster.x-k8s.io/v1alpha3
          metadata:
            name: kubernetes-myk8s-md0
            namespace: tenant-test
            ownerReferences: &ownedByMyk8s
              - {apiVersion: controlplane.cluster.x-k8s.io/v1alpha1, kind: KamajiControlPlane, name: kubernetes-myk8s, uid: "1"}
              - {apiVersion: cluster.x-k8s.io/v1beta1, kind: Cluster, name: kubernetes-myk8s, uid: "2"}
          spec: {template: {spec: {generateType: none}}}
        - <<: *tct
          metadata:
            name: kubernetes-myk8s-md0-111111
            namespace: tenant-test
            labels: {cozystack.io/kubernetes-nodes-release: kubernetes-nodes-myk8s-md0}
            ownerReferences: *ownedByMyk8s
        # This pool's, referenced by nothing: the one to prune.
        - <<: *tct
          metadata:
            name: kubernetes-myk8s-md0-222222
            namespace: tenant-test
            labels: {cozystack.io/kubernetes-nodes-release: kubernetes-nodes-myk8s-md0}
            ownerReferences: *ownedByMyk8s
        - <<: *tct
          metadata:
            name: kubernetes-myk8s-md0-555555
            namespace: tenant-test
            labels: {cozystack.io/kubernetes-nodes-release: kubernetes-nodes-myk8s-md0}
            ownerReferences: *ownedByMyk8s
        # The current template, unreferenced until the rollout starts: kept.
        - <<: *tct
          metadata:
            name: kubernetes-myk8s-md0-ffdbe1
            namespace: tenant-test
            labels: {cozystack.io/kubernetes-nodes-release: kubernetes-nodes-myk8s-md0}
            ownerReferences: *ownedByMyk8s
        # Sibling pool "md0-a1b2c3": its name starts with this pool's.
        - <<: *tct
          metadata:
            name: kubernetes-myk8s-md0-a1b2c3-333333
            namespace: tenant-test
            labels: {cozystack.io/kubernetes-nodes-release: kubernetes-nodes-myk8s-md0-a1b2c3}
            ownerReferences: *ownedByMyk8s
        # Sibling pool "md1" from before content naming: no label.
        - <<: *tct
          metadata:
            name: kubernetes-myk8s-md1
            namespace: tenant-test
            ownerReferences: *ownedByMyk8s
        # Carries this release's label but belongs to another cluster's control
        # plane: the owner check keeps it out.
        - <<: *tct
          metadata:
            name: kubernetes-other-md0-444444
            namespace: tenant-test
            labels: {cozystack.io/kubernetes-nodes-release: kubernetes-nodes-myk8s-md0}
            ownerReferences:
              - {apiVersion: controlplane.cluster.x-k8s.io/v1alpha1, kind: KamajiControlPlane, name: kubernetes-other, uid: "3"}
        # Same name and label in another namespace: never listed.
        - <<: *tct
          metadata:
            name: kubernetes-myk8s-md0-666666
            namespace: tenant-elsewhere
            labels: {cozystack.io/kubernetes-nodes-release: kubernetes-nodes-myk8s-md0}
            ownerReferences: *ownedByMyk8s
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "STALE_TCTS")].value
          value: kubernetes-myk8s-md0-222222
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: rules[?(@.resources[0] == "talosconfigtemplates" && @.verbs[0] == "delete")].resourceNames
          value: ["kubernetes-myk8s-md0-ffdbe1", "kubernetes-myk8s-md0-222222"]
        documentSelector:
          path: kind
          value: Role
      # get/patch/update never widen with the prune list.
      - equal:
          path: rules[?(@.resources[0] == "talosconfigtemplates" && @.verbs[0] == "get")].resourceNames
          value: ["kubernetes-myk8s-md0-ffdbe1"]
        documentSelector:
          path: kind
          value: Role

  - it: prunes the pre-content-naming template once nothing references it, in a stable order
    kubernetesProvider:
      scheme: *scheme
      objects:
        - kind: MachineDeployment
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: kubernetes-myk8s-md0, namespace: tenant-test}
          spec:
            template:
              spec:
                bootstrap:
                  configRef: {kind: TalosConfigTemplate, name: kubernetes-myk8s-md0-ffdbe1}
        - kind: MachineSet
          apiVersion: cluster.x-k8s.io/v1beta1
          metadata: {name: kubernetes-myk8s-md0-cur, namespace: tenant-test}
          spec:
            template:
              spec:
                bootstrap:
                  configRef: {kind: TalosConfigTemplate, name: kubernetes-myk8s-md0-ffdbe1}
        - <<: *tct
          metadata:
            name: kubernetes-myk8s-md0-222222
            namespace: tenant-test
            labels: {cozystack.io/kubernetes-nodes-release: kubernetes-nodes-myk8s-md0}
            ownerReferences: *ownedByMyk8s
        - *tct
        - <<: *tct
          metadata:
            name: kubernetes-myk8s-md0-ffdbe1
            namespace: tenant-test
            labels: {cozystack.io/kubernetes-nodes-release: kubernetes-nodes-myk8s-md0}
            ownerReferences: *ownedByMyk8s
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "STALE_TCTS")].value
          value: kubernetes-myk8s-md0 kubernetes-myk8s-md0-222222
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: rules[?(@.resources[0] == "talosconfigtemplates" && @.verbs[0] == "delete")].resourceNames
          value: ["kubernetes-myk8s-md0-ffdbe1", "kubernetes-myk8s-md0", "kubernetes-myk8s-md0-222222"]
        documentSelector:
          path: kind
          value: Role

  - it: prunes nothing when there is nothing to list
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "STALE_TCTS")].value
          value: ""
        documentSelector:
          path: kind
          value: Job
      - equal:
          path: rules[?(@.resources[0] == "talosconfigtemplates" && @.verbs[0] == "delete")].resourceNames
          value: ["kubernetes-myk8s-md0-ffdbe1"]
        documentSelector:
          path: kind
          value: Role

  # The re-check before each delete reads MachineSets; list is the only verb it
  # needs, and that grant stays read-only.
  - it: grants list on MachineSets for the re-check, and nothing more
    documentSelector:
      path: kind
      value: Role
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["cluster.x-k8s.io"]
            resources: ["machinesets"]
            verbs: ["list"]
      - equal:
          path: rules[?(@.resources[0] == "machinesets")].verbs
          value: ["list"]

  - it: re-checks MachineSets before every prune and fails on any API error
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: '(?s)for STALE in \$\{STALE_TCTS\}; do\s*\n\s*REFS="\$\(kubectl -n "\$NS" get machinesets\.cluster\.x-k8s\.io '
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kubectl -n "\$NS" delete talosconfigtemplate "\$\{STALE\}" --ignore-not-found'
      # The read must not be softened: under `sh -e` a failed command
      # substitution in an assignment ends the Job, and `|| true` would turn an
      # RBAC or API error into "nothing references it" and prune a live template.
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'get machinesets[^\n]*\|\|'
