{{- $host := index .Values._cluster "root-host" }}
{{- $ingressHost := .Values.ingress.host | default (printf "keycloak.%s" $host) }}
{{- $exposeIngress := (index .Values._cluster "expose-ingress") | default "tenant-root" }}
{{- $adminExposeIngress := (index .Values._cluster "expose-ingress-admin") | default $exposeIngress }}
{{- $gatewayEnabled := (index .Values._cluster "gateway-enabled") | default "false" }}
{{- $adminHost := .Values.ingress.adminHost }}
{{- if eq $gatewayEnabled "true" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cozystack
    namespace: {{ $exposeIngress }}
  hostnames:
  - {{ $ingressHost | quote }}
  rules:
  {{- if $adminHost }}
  # adminHost is set: the public (login) hostname exposes only the login paths
  # of the published realms. The admin console and Administration REST API are
  # served exclusively on the dedicated admin route below, so /admin is not
  # reachable here. See the Keycloak reverse proxy guide, "Exposed path
  # recommendations".
  {{- $loginPaths := include "keycloak.loginPaths" . | fromYamlArray }}
  {{- /* A route rule takes at most 64 path matches (Gateway API CRD), and each
         realm takes two of them. Beyond that the apiserver rejects the whole
         HTTPRoute, so say which parameter to shorten. */}}
  {{- if gt (len $loginPaths) 64 }}
  {{-   fail (printf "the login route needs %d path matches but a Gateway API route rule takes at most 64: publish at most 31 realms (ingress.exposedRealms plus the platform realm), got %d" (len $loginPaths) (div (len $loginPaths) 2)) }}
  {{- end }}
  - matches:
    {{- range $p := $loginPaths }}
    - path:
        type: {{ if $p.exact }}Exact{{ else }}PathPrefix{{ end }}
        value: {{ $p.value | quote }}
    {{- end }}
    backendRefs:
    - name: keycloak-http
      port: 8080
  {{- else }}
  - backendRefs:
    - name: keycloak-http
      port: 8080
  {{- end }}
{{- if $adminHost }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-admin
spec:
  # Attaches to the Gateway named cozystack in the admin namespace. When
  # expose-ingress-admin points at a separate (e.g. private-IP) Gateway,
  # admin traffic leaves the public Gateway entirely.
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: cozystack
    namespace: {{ $adminExposeIngress }}
  hostnames:
  - {{ $adminHost | quote }}
  rules:
  - backendRefs:
    - name: keycloak-http
      port: 8080
{{- end }}
{{- end }}
