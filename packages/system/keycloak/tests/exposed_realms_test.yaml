suite: published realms on the login host (ingress.exposedRealms)

release:
  name: keycloak
  namespace: cozy-keycloak

# In the narrowed mode (ingress.adminHost set) the login host publishes realm
# paths. A bare /realms prefix publishes every realm the deployment happens to
# have, including master, whose token endpoint then accepts super-admin
# credentials from the internet. The login route therefore enumerates the
# realms that are meant to be public: the platform realm by default,
# ingress.exposedRealms when a deployment serves more than one.
#
# Each realm is published as an exact path plus a trailing-slash prefix, so a
# controller that treats `pathType: Prefix` as a byte prefix cannot serve a
# realm whose name merely extends a published one.
tests:
  # --- HTTPRoute (gateway enabled) ---
  - it: publishes only the platform realm by default
    template: templates/httproute.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
    asserts:
      - lengthEqual:
          path: spec.rules[0].matches
          count: 4
      - equal:
          path: spec.rules[0].matches[0].path
          value:
            type: Exact
            value: /realms/cozy
      - equal:
          path: spec.rules[0].matches[1].path
          value:
            type: PathPrefix
            value: /realms/cozy/
      - equal:
          path: spec.rules[0].matches[2].path.value
          value: /resources
      - equal:
          path: spec.rules[0].matches[3].path.value
          value: /.well-known
      # the bare prefix is gone: /realms/master is no longer routed
      - notContains:
          path: spec.rules[0].matches
          content:
            path:
              type: PathPrefix
              value: /realms

  - it: follows the platform realm name
    template: templates/httproute.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
        oidc-realm-name: acme
      ingress:
        adminHost: keycloak-admin.example.com
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /realms/acme
      - equal:
          path: spec.rules[0].matches[1].path.value
          value: /realms/acme/

  # A platform realm name YAML parsed as a number still names a realm: the
  # platform validates that key, and a bare number there must not be reported
  # as an exposedRealms the operator never set.
  - it: accepts a platform realm name that is not a string
    template: templates/httproute.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
        oidc-realm-name: 123
      ingress:
        adminHost: keycloak-admin.example.com
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /realms/123

  - it: publishes every realm listed in exposedRealms
    template: templates/httproute.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - cozy
        - cozy-admin
    asserts:
      - lengthEqual:
          path: spec.rules[0].matches
          count: 6
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /realms/cozy
      - equal:
          path: spec.rules[0].matches[2].path.value
          value: /realms/cozy-admin

  - it: leaves the login HTTPRoute serving everything without adminHost
    template: templates/httproute.yaml
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        exposedRealms:
        - cozy
    asserts:
      - hasDocuments:
          count: 1
      - isNull:
          path: spec.rules[0].matches

  - it: keeps the admin HTTPRoute serving the whole admin plane
    template: templates/httproute.yaml
    documentIndex: 1
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - cozy
    asserts:
      - equal:
          path: metadata.name
          value: keycloak-admin
      - isNull:
          path: spec.rules[0].matches

  # --- Ingress (gateway disabled) ---
  - it: publishes only the platform realm on the login Ingress by default
    template: templates/ingress.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
      ingress:
        adminHost: keycloak-admin.example.com
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 4
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /realms/cozy
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Exact
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /realms/cozy/
      - equal:
          path: spec.rules[0].http.paths[1].pathType
          value: Prefix
      - notContains:
          path: spec.rules[0].http.paths
          content:
            path: /realms
            pathType: Prefix
          any: true

  - it: publishes every realm listed in exposedRealms on the login Ingress
    template: templates/ingress.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - cozy
        - cozy-admin
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 6
      - equal:
          path: spec.rules[0].http.paths[2].path
          value: /realms/cozy-admin
      - equal:
          path: spec.rules[0].http.paths[3].path
          value: /realms/cozy-admin/

  # --- validation ---
  - it: rejects a realm name that would split the URL path
    template: templates/httproute.yaml
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - cozy/../admin
    asserts:
      - failedTemplate:
          errorPattern: "ingress.exposedRealms"

  - it: rejects an empty realm name
    template: templates/httproute.yaml
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - ""
    asserts:
      - failedTemplate:
          errorPattern: "ingress.exposedRealms"

  - it: rejects a realm name that is not a string
    template: templates/ingress.yaml
    set:
      _cluster:
        root-host: example.com
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - 42
    asserts:
      - failedTemplate:
          errorPattern: "ingress.exposedRealms entries must be strings"

  - it: rejects a scalar in place of the realm list
    template: templates/ingress.yaml
    set:
      _cluster:
        root-host: example.com
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms: cozy
    asserts:
      - failedTemplate:
          errorPattern: "ingress.exposedRealms must be a list"

  - it: names the platform realm, not exposedRealms, when the realm name is invalid
    template: templates/ingress.yaml
    set:
      _cluster:
        root-host: example.com
        oidc-realm-name: "bad/name"
      ingress:
        adminHost: keycloak-admin.example.com
    asserts:
      - failedTemplate:
          errorPattern: "platform realm name"
