suite: published realms on the login host (ingress.exposedRealms)

release:
  name: keycloak
  namespace: cozy-keycloak

# In the narrowed mode (ingress.adminHost set) the login host publishes realm
# paths. A bare /realms prefix publishes every realm the deployment happens to
# have, including master, whose token endpoint then accepts super-admin
# credentials from the internet. The login route therefore enumerates the
# realms that are meant to be public: the platform realm by default,
# ingress.exposedRealms when a deployment serves more than one.
tests:
  # --- HTTPRoute (gateway enabled) ---
  - it: publishes only the platform realm by default
    template: templates/httproute.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
    asserts:
      - lengthEqual:
          path: spec.rules[0].matches
          count: 3
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /realms/cozy
      - equal:
          path: spec.rules[0].matches[1].path.value
          value: /resources
      - equal:
          path: spec.rules[0].matches[2].path.value
          value: /.well-known
      # the bare prefix is gone: /realms/master is no longer routed
      - notContains:
          path: spec.rules[0].matches
          content:
            path:
              type: PathPrefix
              value: /realms

  - it: follows the platform realm name
    template: templates/httproute.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
        oidc-realm-name: acme
      ingress:
        adminHost: keycloak-admin.example.com
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /realms/acme

  - it: publishes every realm listed in exposedRealms
    template: templates/httproute.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - cozy
        - cozy-admin
    asserts:
      - lengthEqual:
          path: spec.rules[0].matches
          count: 4
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: /realms/cozy
      - equal:
          path: spec.rules[0].matches[1].path.value
          value: /realms/cozy-admin

  - it: leaves the login HTTPRoute serving everything without adminHost
    template: templates/httproute.yaml
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        exposedRealms:
        - cozy
    asserts:
      - hasDocuments:
          count: 1
      - isNull:
          path: spec.rules[0].matches

  - it: keeps the admin HTTPRoute serving the whole admin plane
    template: templates/httproute.yaml
    documentIndex: 1
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - cozy
    asserts:
      - equal:
          path: metadata.name
          value: keycloak-admin
      - isNull:
          path: spec.rules[0].matches

  # --- Ingress (gateway disabled) ---
  - it: publishes only the platform realm on the login Ingress by default
    template: templates/ingress.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
      ingress:
        adminHost: keycloak-admin.example.com
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 3
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /realms/cozy
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix

  - it: publishes every realm listed in exposedRealms on the login Ingress
    template: templates/ingress.yaml
    documentIndex: 0
    set:
      _cluster:
        root-host: example.com
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - cozy
        - cozy-admin
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 4
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /realms/cozy-admin

  # --- validation ---
  - it: rejects a realm name that would split the URL path
    template: templates/httproute.yaml
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - cozy/../admin
    asserts:
      - failedTemplate:
          errorPattern: "ingress.exposedRealms"

  - it: rejects an empty realm name
    template: templates/httproute.yaml
    set:
      _cluster:
        root-host: example.com
        gateway-enabled: "true"
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - ""
    asserts:
      - failedTemplate:
          errorPattern: "ingress.exposedRealms"

  - it: rejects a realm name that is not a string
    template: templates/ingress.yaml
    set:
      _cluster:
        root-host: example.com
      ingress:
        adminHost: keycloak-admin.example.com
        exposedRealms:
        - 42
    asserts:
      - failedTemplate:
          errorPattern: "ingress.exposedRealms"
