suite: shared-central traces credentials
templates:
  - templates/vtraces/central-credentials.yaml

# The collector and Grafana log in to the tenant-root vmauth with these
# credentials. The chart owns them rather than the operator, which creates a
# VMUser's Secret only while some VMAuth selects that user: without a central
# store the collector would wait on a Secret that never appears.
release:
  name: monitoring
  namespace: tenant-foo

tests:
  - it: generates the credentials for a central tenant
    set:
      _namespace:
        tracingCentral: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: traces-central-credentials
      - equal:
          path: stringData.username
          value: tenant-foo
      # Random by design; only its presence is the contract.
      - matchRegex:
          path: stringData.password
          pattern: "^.+$"

  - it: preserves the existing password rather than rotating it
    set:
      _namespace:
        tracingCentral: true
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: traces-central-credentials
            namespace: tenant-foo
          data:
            # base64 of "tenant-foo" and "preserved-password"
            username: dGVuYW50LWZvbw==
            password: cHJlc2VydmVkLXBhc3N3b3Jk
    asserts:
      - equal:
          path: stringData.password
          value: preserved-password

  - it: renders no credentials outside central mode
    asserts:
      - hasDocuments:
          count: 0
