{{- /*
  The central tenant's login at the tenant-root vmauth, read by its collector
  and its Grafana datasource and referenced by its VMUser. Owned here because
  the operator publishes a VMUser's generated Secret only while some VMAuth
  selects that user, so the collector would otherwise wait on a Secret that
  never appears when tenant-root has no central store. The password is kept
  across renders (monitoring.tracingCentralPassword).
*/ -}}
{{- if include "monitoring.tracingCentral" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: traces-central-credentials
  labels:
    apps.cozystack.io/application.name: {{ .Release.Name }}
type: Opaque
stringData:
  username: {{ .Release.Namespace | quote }}
  password: {{ include "monitoring.tracingCentralPassword" . | quote }}
{{- end }}
