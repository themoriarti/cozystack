name: Promote RC

# Bless a release-candidate as stable WITHOUT rebuilding it.
#
# A stable release is a renamed release-candidate: the bytes shipped as vX.Y.Z
# are bit-for-bit the bytes built and e2e-tested as vX.Y.Z-rc.N.
#
# Promotion is TRANSACTIONAL: this dispatch performs NO registry mutation. It
# only pushes the release-X.Y.Z staging branch (the rc's digest-vendored tree
# with the rc version substring rewritten to stable), drafts the stable release
# with restamped assets, and opens the release-X.Y.Z PR. The rc's mandatory full
# e2e is verified before staging; the promote PR does not repeat it by default.
# Every irreversible registry side effect — retagging the rc's images to the
# stable tag by digest, moving :latest, publishing the stable cozy-installer
# chart — happens in pull-requests-release.yaml finalize, AFTER the PR has merged.
# An abandoned promotion therefore leaves nothing but an overwritable draft +
# branch: no stable-named bytes, nothing to wedge a later re-promotion.
#
# Triggered manually once an rc has gone green. The stable git tag is never
# pushed by a human and never force-moved — it is created only at PR merge,
# against a commit that did not exist before this PR opened.

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "Release-candidate tag to promote, e.g. v1.4.0-rc.2"
        required: true
        type: string
      skip_e2e_gate:
        description: "BYPASS the required green rc E2E check (emergency use only)"
        required: false
        default: false
        type: boolean

concurrency:
  # Serialize ALL promotions. Keying on the rc tag would parallelize the
  # dangerous case: promote(rc.1) and promote(rc.2) of the SAME version racing
  # to force-push the release-X.Y.Z branch and (re)stage the same stable draft.
  # Promotions are rare, so one global lane costs nothing and is race-free.
  # (The image retag itself now runs in pull-requests-release.yaml finalize,
  # post-merge, where the single release-X.Y.Z PR guarantees a single run.)
  group: promote-rc
  cancel-in-progress: false

# Read-only by default; each job widens only what it needs (see per-job blocks).
permissions:
  contents: read

jobs:
  # Cheap front door: validate the dispatch input ONCE and derive every release
  # identifier, before any heavy job starts. Both `promote` and `changelog`
  # depend on this, so they still run in parallel with each other (this job takes
  # seconds) while consuming ONE validated tag — no divergent second parse.
  # Whitespace is rejected outright (not trimmed), matching hack/parse-rc-tag.sh
  # and the reusable core: a non-canonical spelling is an immediate dispatch
  # failure, so promote and the changelog job can never disagree about whether the
  # tag is valid — the divergence that previously left a promote PR with no
  # changelog.
  parse:
    name: Parse and validate rc tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # list tags.yaml / e2e-tag.yaml runs and their jobs for the rc E2E gate
      contents: read
    outputs:
      rc_tag: ${{ steps.parse.outputs.rc_tag }}
      rc_version: ${{ steps.parse.outputs.rc_version }}
      stable_tag: ${{ steps.parse.outputs.stable_tag }}
      stable_version: ${{ steps.parse.outputs.stable_version }}
      stable_branch: ${{ steps.parse.outputs.stable_branch }}
      rc_branch: ${{ steps.parse.outputs.rc_branch }}
      line: ${{ steps.parse.outputs.line }}
      e2e_verification: ${{ steps.e2e-gate.outputs.verification || steps.e2e-bypass.outputs.verification }}
    steps:
      # Validate the dispatch input against a strict rc pattern before it ever
      # reaches a shell or an API call. Derives the stable version, the rc
      # staging branch, and the maintenance line.
      - name: Parse and validate rc tag
        id: parse
        env:
          RC_TAG: ${{ inputs.rc_tag }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const rc = process.env.RC_TAG;
            // Reject whitespace outright rather than trimming it. Trimming would
            // accept ' v1.4.0-rc.2 ' here while the parallel changelog job — which
            // rejects whitespace — refuses the same input, so promote would push
            // the stable branch and open-pr would open a PR with no changelog. One
            // policy everywhere: non-canonical spelling = dispatch failure.
            if (/\s/.test(rc)) {
              core.setFailed(`rc_tag '${rc}' must not contain whitespace`);
              return;
            }
            const m = rc.match(/^v(\d+)\.(\d+)\.(\d+)-rc\.(\d+)$/);
            if (!m) {
              core.setFailed(`rc_tag '${rc}' must match 'vX.Y.Z-rc.N'`);
              return;
            }
            const [maj, min, patch] = [m[1], m[2], m[3]];
            const version = `${maj}.${min}.${patch}`;
            core.setOutput('rc_tag', rc);
            core.setOutput('rc_version', `${version}-rc.${m[4]}`);   // 1.4.0-rc.2
            core.setOutput('stable_tag', `v${version}`);             // v1.4.0
            core.setOutput('stable_version', version);               // 1.4.0
            core.setOutput('rc_branch', `release-${version}-rc.${m[4]}`);
            core.setOutput('stable_branch', `release-${version}`);
            core.setOutput('line', `${maj}.${min}`);

      # Keep the check in this front-door job: both staging paths already need
      # parse, so a red/missing rc E2E stops promote and changelog before either
      # can write anything. GitHub's jobs API names a called-workflow job as
      # "<caller job name> / <called workflow job name>"; direct dispatch jobs
      # expose only the called job name. The suffix matcher deliberately accepts
      # both forms.
      #
      # e2e-tag.yaml has no run-name and its workflow name is constant, so a
      # dispatch run's title cannot identify inputs.tag. The expanded E2E job
      # name is the strongest API-visible correlator because it embeds the exact
      # validated tag. Its failure modes are Actions retention/deletion removing
      # the run/job metadata, or a future rename of that job without updating
      # this matcher; either case fails closed and can be recovered by running
      # the E2E Release Tag button again.
      - name: Verify green RC E2E
        id: e2e-gate
        if: ${{ !inputs.skip_e2e_gate }}
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RC_TAG: ${{ steps.parse.outputs.rc_tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const rcTag = process.env.RC_TAG;
            const expectedJob = `E2E ${rcTag} (full suite)`;
            const matchesE2EJob = (name) =>
              name === expectedJob || name.endsWith(` / ${expectedJob}`);
            const jobsForRun = (runId) => github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                filter: 'latest',
                per_page: 100
              }
            );

            // Evidence A: only the latest tags.yaml push run for this tag counts.
            const tagRunsResponse = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'tags.yaml',
              branch: rcTag,
              event: 'push',
              per_page: 100
            });
            const latestTagRun = tagRunsResponse.data.workflow_runs.find(
              (run) => run.head_branch === rcTag
            );
            let tagEvidence = `no tags.yaml push run found with head_branch '${rcTag}'`;
            if (latestTagRun) {
              const jobs = await jobsForRun(latestTagRun.id);
              const matches = jobs.filter((job) => matchesE2EJob(job.name));
              tagEvidence = `latest tags.yaml run ${latestTagRun.html_url} (${latestTagRun.status}/${latestTagRun.conclusion || 'no conclusion'}), matching jobs: ${
                matches.length
                  ? matches.map((job) => `'${job.name}'=${job.conclusion || job.status}`).join(', ')
                  : 'none'
              }`;
              core.info(`Evidence A: ${tagEvidence}`);
              if (matches.some((job) => job.conclusion === 'success')) {
                core.setOutput('verification', 'verified');
                core.notice(`✅ Verified green rc E2E for ${rcTag} via the latest tags.yaml run.`);
                await core.summary
                  .addRaw(`✅ RC full E2E verified for \`${rcTag}\` via the latest \`tags.yaml\` run.`)
                  .write();
                return;
              }
            } else {
              core.info(`Evidence A: ${tagEvidence}`);
            }

            // Evidence B: dispatch run titles are all "E2E Release Tag", so walk
            // retained successful dispatch runs and correlate by the expanded
            // tag-bearing job name instead.
            const dispatchRuns = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'e2e-tag.yaml',
                event: 'workflow_dispatch',
                status: 'success',
                per_page: 100
              }
            );
            let dispatchMatch;
            for (const run of dispatchRuns) {
              const jobs = await jobsForRun(run.id);
              const job = jobs.find(
                (candidate) =>
                  matchesE2EJob(candidate.name) &&
                  candidate.conclusion === 'success'
              );
              if (job) {
                dispatchMatch = {run, job};
                break;
              }
            }

            if (dispatchMatch) {
              core.info(
                `Evidence B: ${dispatchMatch.run.html_url}, job '${dispatchMatch.job.name}'=${dispatchMatch.job.conclusion}`
              );
              core.setOutput('verification', 'verified');
              core.notice(`✅ Verified green rc E2E for ${rcTag} via an e2e-tag.yaml workflow_dispatch run.`);
              await core.summary
                .addRaw(`✅ RC full E2E verified for \`${rcTag}\` via a manual \`e2e-tag.yaml\` run.`)
                .write();
              return;
            }

            const dispatchEvidence = `${dispatchRuns.length} retained successful e2e-tag.yaml workflow_dispatch run(s), none with a successful '${expectedJob}' job`;
            core.info(`Evidence B: ${dispatchEvidence}`);
            core.setFailed(
              `RC '${rcTag}' has no green full E2E evidence. Checked evidence A: ${tagEvidence}. Checked evidence B: ${dispatchEvidence}. Run the "E2E Release Tag" Actions button for '${rcTag}', or re-dispatch Promote RC with skip_e2e_gate=true only if you intentionally accept the emergency bypass.`
            );

      - name: Bypass RC E2E gate (emergency override)
        id: e2e-bypass
        if: ${{ inputs.skip_e2e_gate }}
        env:
          RC_TAG: ${{ steps.parse.outputs.rc_tag }}
        run: |
          echo "verification=bypassed" >> "$GITHUB_OUTPUT"
          echo "::warning title=RC E2E GATE BYPASSED::Promoting ${RC_TAG} without verified green full E2E evidence."
          printf '## ⚠️ RC E2E gate bypassed\n\n`%s` is being promoted without verified green full E2E evidence.\n' "$RC_TAG" >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote ${{ needs.parse.outputs.rc_tag }}
    needs: parse
    runs-on: [oracle-vm-4cpu-16gb-x86-64]
    timeout-minutes: 45
    permissions:
      contents: write # push the release-X.Y.Z staging branch, stage the draft release
      packages: write # read image manifests for asset staging (retag runs in finalize)
      pull-requests: write # reserved for parity; the PR is opened in open-pr

    # open-pr reads these from `promote`, which passes the parse job's validated
    # outputs straight through.
    outputs:
      rc_tag: ${{ needs.parse.outputs.rc_tag }}
      stable_tag: ${{ needs.parse.outputs.stable_tag }}
      stable_version: ${{ needs.parse.outputs.stable_version }}
      stable_branch: ${{ needs.parse.outputs.stable_branch }}
      line: ${{ needs.parse.outputs.line }}
      e2e_verification: ${{ needs.parse.outputs.e2e_verification }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.COZYSTACK_CI_APP_ID }}
          private-key: ${{ secrets.COZYSTACK_CI_PRIVATE_KEY }}
          owner: cozystack
          # Scope the token to this repo only — it never touches other repos.
          repositories: ${{ github.event.repository.name }}

      # Gate: the rc must exist as a (draft) release and the stable tag must NOT
      # exist yet. Refuse to promote twice or to an already-shipped version.
      - name: Validate rc is promotable
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const rcTag     = '${{ needs.parse.outputs.rc_tag }}';
            const stableTag = '${{ needs.parse.outputs.stable_tag }}';
            const releases  = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const rcRel = releases.find(r => r.tag_name === rcTag);
            if (!rcRel) {
              core.setFailed(`No release found for rc '${rcTag}' — has it been built?`);
              return;
            }
            // Reject only a *published* stable release. A leftover *draft* is
            // tolerated: promotion no longer mutates the registry at dispatch
            // time (retag/chart/:latest all run in finalize, post-merge), so an
            // abandoned promotion leaves nothing but an overwritable draft +
            // staging branch. Failing on the draft would wedge re-promotion of a
            // newer rc to the same version; instead the draft is refreshed below.
            const publishedStable = releases.find(r => r.tag_name === stableTag && !r.draft);
            if (publishedStable) {
              core.setFailed(`Stable release '${stableTag}' is already published — refusing to re-promote.`);
              return;
            }
            // The stable git tag must not pre-exist either: finalize creates it
            // write-once at the PR merge commit, so a stray tag (from a manual
            // push) would only fail that step after merge. Catch it here.
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner, repo: context.repo.repo,
                ref: `tags/${stableTag}`
              });
              core.setFailed(`Stable tag '${stableTag}' already exists — refusing to re-promote.`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            // Surface the rc's disk asset id for the copy step.
            const disk = (rcRel.assets || []).find(a => a.name === 'nocloud-amd64.raw.xz');
            if (!disk) {
              core.setFailed(`rc release '${rcTag}' has no nocloud-amd64.raw.xz asset.`);
              return;
            }
            core.setOutput('disk_id', String(disk.id));
        id: validate

      # The rc's digest-vendored tree (the staging branch the rc build pushed).
      - name: Checkout rc staging branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.parse.outputs.rc_branch }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}
          # The Prepare stable branch step re-injects the token via
          # `git remote set-url`, so there's no need to persist it in .git/config.
          persist-credentials: false

      # Only yq is needed here (the asset make targets use it). The registry
      # side of promotion — retagging the rc images to stable, moving :latest,
      # publishing the stable chart — is deferred to pull-requests-release.yaml
      # finalize, so promotion touches the registry only AFTER the promote PR's
      # e2e has passed and the PR has merged (transactional promotion). No
      # skopeo/helm login here.
      - name: Set up toolchain (yq)
        run: |
          command -v yq >/dev/null \
            || { sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && sudo chmod +x /usr/local/bin/yq; }

      # A second checkout of the DISPATCH ref, used only as a source of release
      # tooling. The primary checkout above is an older commit (the rc tag, or a
      # branch derived from it) and does not carry hack/validate-changelog.sh or
      # the current docs/agents/changelog.md — and a script fetched by a script
      # that is itself missing solves nothing, so this is done declaratively by
      # actions/checkout rather than by shelling out to the repo's own tooling.
      # Gitignored, so promote's `git add -A` never stages it.
      - name: Checkout release tooling from the dispatch ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_name }}
          path: .release-tooling
          sparse-checkout: |
            hack
            docs/agents
          persist-credentials: false

      # Build the stable digest-vendored tree off the rc tree: the digests are
      # unchanged (they pin the rc's images, which finalize retags to stable);
      # only the cosmetic -rc.N substring in the image tag is rewritten to the
      # stable version (decision A — the @sha256 wins regardless, this is for
      # human readability).
      - name: Prepare stable branch
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RC_VERSION: ${{ needs.parse.outputs.rc_version }}
          STABLE_VERSION: ${{ needs.parse.outputs.stable_version }}
          STABLE_BRANCH: ${{ needs.parse.outputs.stable_branch }}
          RC_TAG: ${{ needs.parse.outputs.rc_tag }}
        run: |
          git config user.name  "cozystack-ci[bot]"
          git config user.email "274107086+cozystack-ci[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}
          # Rewrite the rc version substring -> stable in vendored image tags.
          # The logic lives in a script, not inline here, so that
          # hack/promote-rewrite-tags_test.bats can round-trip it against the
          # real tree: this step's previous inline glob covered the depth-2
          # values.yaml plus packages/apps/kubernetes/images/*.tag alone and
          # silently left nine other .tag files and one stamped template on the
          # rc version, which was only observable by cutting a release.
          # The script fails if any rc reference survives it.
          hack/promote-rewrite-tags.sh "$RC_VERSION" "$STABLE_VERSION"
          # Preserve a changelog already committed on the stable staging branch
          # across the rebuild. -B below resets the branch to the rc tree, which
          # would otherwise silently discard it — and the two ways it gets there
          # are exactly the ones worth protecting: a maintainer hand-writing it
          # (the documented escape hatch when generation fails) and an earlier
          # dispatch's reviewed output. Losing either to a retry would replace
          # human-edited release notes with a fresh AI run, or with nothing.
          CL="docs/changelogs/v${STABLE_VERSION}.md"
          PRESERVED="$(mktemp)"
          if .release-tooling/hack/changelog-preserve.sh "${STABLE_BRANCH}" "${STABLE_VERSION}" "${PRESERVED}"; then
            echo "::notice::Preserving existing ${CL} from ${STABLE_BRANCH} across the rebuild."
          else
            rm -f "${PRESERVED}"
            PRESERVED=""
          fi
          # -B resets the local branch so a re-dispatch starts clean.
          git checkout -B "${STABLE_BRANCH}"
          if [ -n "$PRESERVED" ]; then
            mkdir -p docs/changelogs
            cp "$PRESERVED" "$CL"
            rm -f "$PRESERVED"
          fi
          git add -A
          git commit -s -m "Prepare release v${STABLE_VERSION} (promoted from ${RC_TAG})" \
            || echo "No tag-string changes to commit (digests already stable)"
          # Compare-before-force, matching tags.yaml's Create release branch step.
          # git commit above produces a fresh, timestamp-dependent SHA each run,
          # so a re-dispatch (retry after a later step failed, or promoting a
          # newer rc to the same version) creates a SIBLING commit. A plain push
          # would then be rejected non-fast-forward and wedge re-promotion until
          # the branch is deleted by hand — contradicting the validate step's
          # leftover-draft tolerance and this workflow's "overwritable branch,
          # nothing to wedge" header. This is a mutable staging branch: skip when
          # unchanged, force + log when it genuinely moves.
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git ls-remote --heads origin "${STABLE_BRANCH}" | awk '{print $1}')"
          if [ -z "$REMOTE" ]; then
            git push origin "HEAD:refs/heads/${STABLE_BRANCH}"
            echo "✅ Created staging branch ${STABLE_BRANCH} at ${LOCAL}."
          elif [ "$REMOTE" = "$LOCAL" ]; then
            echo "✅ ${STABLE_BRANCH} already at ${LOCAL}; nothing to do."
          else
            echo "::notice::Force-updating staging branch ${STABLE_BRANCH}: ${REMOTE} -> ${LOCAL}."
            git push -f origin "HEAD:refs/heads/${STABLE_BRANCH}"
          fi

      # Assemble the stable draft's assets. Start from the rc draft's assets
      # (the heavy Talos ISO/disk/kernel/initramfs are identical bits — the rc
      # e2e booted them), then OVERWRITE only the version-stamped, cheap-to-render
      # ones with stable-stamped builds (restamp, decision D): operator manifests
      # carry platformVersion=vX.Y.Z, cozypkg / check-readiness report the stable
      # version, CRDs + openapi are regenerated. No image build.
      - name: Stage rc assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RC_TAG: ${{ needs.parse.outputs.rc_tag }}
        run: |
          mkdir -p _out/assets
          gh release download "${RC_TAG}" --dir _out/assets --clobber

      - name: Restamp version-stamped assets
        env:
          STABLE_VERSION: ${{ needs.parse.outputs.stable_version }}
        run: |
          make manifests assets-cozypkg openapi-json COZYSTACK_VERSION="${STABLE_VERSION}"

      - name: Create draft stable release and upload assets
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STABLE_TAG: ${{ needs.parse.outputs.stable_tag }}
          STABLE_VERSION: ${{ needs.parse.outputs.stable_version }}
          RC_TAG: ${{ needs.parse.outputs.rc_tag }}
        run: |
          # Draft now; pull-requests-release.yaml publishes it on PR merge.
          gh release view "${STABLE_TAG}" >/dev/null 2>&1 \
            || gh release create "${STABLE_TAG}" --draft --title "${STABLE_TAG}" --notes "Promoted from ${RC_TAG}."
          # upload_assets depends on `manifests`, which re-renders the operator
          # manifests — pass COZYSTACK_VERSION so that re-render re-stamps the
          # stable version instead of blanking the platformVersion set by the
          # Restamp step above.
          make upload_assets VERSION="${STABLE_TAG}" COZYSTACK_VERSION="${STABLE_VERSION}"

  # ── Changelog: generated by the reusable changelog-generate.yaml, at promote
  #    time, so it rides the promote PR and is on the base branch the moment the
  #    release publishes.
  #
  #    Previously this lived in tags.yaml::generate-changelog, gated on the stable
  #    tag push. Under the promote flow that tag is created by
  #    pull-requests-release.yaml finalize — i.e. AFTER the release is published —
  #    so the changelog PR could only ever be opened once the release was already
  #    public. Moving generation here is the only fix; re-gating the tag-triggered
  #    job cannot help.
  #
  #    The generation logic is factored into .github/workflows/changelog-generate.yaml
  #    (workflow_call) and shared with changelog-rc.yaml, the rc-time button. The
  #    OBSERVABLE behavior here is unchanged: same detached rc-tag checkout, same
  #    read-only token for the AI step, same validator gate, same artifact name
  #    (changelog-vX.Y.Z) that `open-pr` downloads, same non-blocking failure
  #    tolerance. It gains one thing — the reusable workflow's skip check also
  #    looks at the rc STAGING branch (release-X.Y.Z-rc.N): if changelog-rc.yaml
  #    already generated the changelog at rc time, this COPIES it instead of
  #    running the AI pass again.
  #
  #    Runs in PARALLEL with `promote`: generation is AI-driven and slow, while
  #    `promote` spends most of its wall clock downloading and re-uploading the
  #    heavy Talos assets. Both depend only on the cheap `parse` job (seconds), so
  #    they still start together and `open-pr` joins them. It is handed the tag
  #    `parse` already validated (needs.parse.outputs.rc_tag) rather than the raw
  #    dispatch input, so promote and this job cannot diverge on whether the tag
  #    is valid — a whitespace-bearing input fails `parse`, taking the whole
  #    promotion down, instead of promote succeeding while this job rejects it and
  #    the PR opens with no changelog. `secrets` are passed explicitly, matching
  #    the reusable workflow's declared interface.
  changelog:
    name: Generate changelog
    needs: parse
    permissions:
      contents: read
    uses: ./.github/workflows/changelog-generate.yaml
    with:
      rc_tag: ${{ needs.parse.outputs.rc_tag }}
    secrets:
      COZYSTACK_CI_APP_ID: ${{ secrets.COZYSTACK_CI_APP_ID }}
      COZYSTACK_CI_PRIVATE_KEY: ${{ secrets.COZYSTACK_CI_PRIVATE_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

  # Join point: commits the changelog onto the staging branch `promote` pushed,
  # then opens the release PR. Split out of `promote` so changelog generation can
  # run concurrently with the asset staging rather than after it.
  open-pr:
    name: Open promote PR
    runs-on: ubuntu-latest
    needs: [promote, changelog]
    # `needs` alone would SKIP this job whenever `changelog` fails, which would
    # leave the staging branch pushed and the draft release staged but no promote
    # PR at all — the exact wedge the non-blocking design exists to prevent.
    # Only the AI *step* carries continue-on-error; everything else in that job
    # (token, checkout, node setup, `npm i -g @github/copilot`, artifact upload,
    # the job timeout) is still fatal, and an npm or Copilot outage is precisely
    # the scenario this must survive. Gate on `promote` alone and let the
    # `needs.changelog.outputs.present` guards below degrade to the documented
    # "PR opens with the ⚠️ body" path.
    if: ${{ !cancelled() && needs.promote.result == 'success' }}
    timeout-minutes: 15
    permissions:
      contents: write # commit the changelog onto the staging branch
      pull-requests: write # open (or refresh) the promote PR
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.COZYSTACK_CI_APP_ID }}
          private-key: ${{ secrets.COZYSTACK_CI_PRIVATE_KEY }}
          owner: cozystack
          repositories: ${{ github.event.repository.name }}

      # Credentials are persisted here (unlike the other checkouts in this
      # workflow): the Open PR step runs `git ls-remote` to pick the base branch
      # whether or not the changelog step ran, so it cannot rely on the
      # `git remote set-url` that only the conditional commit step performs.
      - name: Checkout stable staging branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.promote.outputs.stable_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # A changelog already on the staging branch was put there deliberately —
      # hand-written by a maintainer, or carried over from an earlier dispatch by
      # `promote`'s preserve step — and must win over a fresh AI run. Without this
      # check the artifact download below would silently overwrite human edits.
      # A second checkout of the DISPATCH ref, used only as a source of release
      # tooling. The primary checkout above is an older commit (the rc tag, or a
      # branch derived from it) and does not carry hack/validate-changelog.sh or
      # the current docs/agents/changelog.md — and a script fetched by a script
      # that is itself missing solves nothing, so this is done declaratively by
      # actions/checkout rather than by shelling out to the repo's own tooling.
      # Gitignored, so promote's `git add -A` never stages it.
      - name: Checkout release tooling from the dispatch ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_name }}
          path: .release-tooling
          sparse-checkout: |
            hack
            docs/agents
          persist-credentials: false

      # Validated with the same script the changelog job uses, not a bare `-s`.
      # A pre-existing file reaches here by two routes that skip generation
      # entirely — hand-written into the rc tree, or preserved by `promote` across
      # the force-push — so nothing else has checked it. Treating "non-empty" as
      # "good" would let a truncated hand-commit be advertised with ✅ and
      # published verbatim as the release body.
      - name: Check for an existing changelog on the branch
        id: existing
        env:
          STABLE_VERSION: ${{ needs.promote.outputs.stable_version }}
        run: |
          CL="docs/changelogs/v${STABLE_VERSION}.md"
          if [ ! -s "$CL" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif REASON="$(.release-tooling/hack/validate-changelog.sh "$CL" "${STABLE_VERSION}" 2>&1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "✅ Changelog already on the staging branch and valid — keeping it, not overwriting with generated output. ${REASON}"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::A changelog is on the staging branch but is not usable (${REASON}). Falling back to this run's generated output if there is one."
          fi

      # continue-on-error: a transient artifact-transfer failure must not abort
      # the job before the PR is opened. Without it the download step is fatal,
      # and the promotion ends with a pushed staging branch, a drafted release and
      # no promote PR — the same wedge the job-level `if:` exists to prevent, one
      # step further down.
      - name: Download changelog artifact
        id: download
        if: needs.changelog.outputs.present == 'true' && steps.existing.outputs.present == 'false'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog-v${{ needs.promote.outputs.stable_version }}
          path: docs/changelogs

      # Re-establish ground truth from the filesystem rather than trusting the
      # upstream job's output: the artifact may have failed to transfer, and what
      # actually matters from here on is whether a usable file is on disk.
      - name: Confirm changelog on disk
        id: usable
        env:
          STABLE_VERSION: ${{ needs.promote.outputs.stable_version }}
        run: |
          CL="docs/changelogs/v${STABLE_VERSION}.md"
          if [ -s "$CL" ] && REASON="$(.release-tooling/hack/validate-changelog.sh "$CL" "${STABLE_VERSION}" 2>&1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "✅ ${REASON}"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No usable changelog available for v${STABLE_VERSION} — the promote PR will open without one."
          fi

      # Only when the file came from the artifact. A changelog already on the
      # branch was committed by `promote` (preserve path) and needs no second commit.
      - name: Commit changelog to staging branch
        if: steps.usable.outputs.present == 'true' && steps.existing.outputs.present == 'false'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          STABLE_VERSION: ${{ needs.promote.outputs.stable_version }}
          STABLE_BRANCH: ${{ needs.promote.outputs.stable_branch }}
        run: |
          set -euo pipefail
          git config user.name  "cozystack-ci[bot]"
          git config user.email "274107086+cozystack-ci[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git add "docs/changelogs/v${STABLE_VERSION}.md"
          if git diff --cached --quiet; then
            echo "✅ Changelog already committed on ${STABLE_BRANCH}; nothing to do."
            exit 0
          fi
          git commit -s -m "docs: add changelog for v${STABLE_VERSION}"
          git push origin "HEAD:refs/heads/${STABLE_BRANCH}"
          echo "✅ Committed changelog to ${STABLE_BRANCH}."

      - name: Open promote (release) PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STABLE_BRANCH: ${{ needs.promote.outputs.stable_branch }}
          STABLE_TAG: ${{ needs.promote.outputs.stable_tag }}
          STABLE_VERSION: ${{ needs.promote.outputs.stable_version }}
          # From promote's validated parse, not raw dispatch input — the rc tag is
          # pattern-checked exactly once and every consumer reads that result.
          RC_TAG: ${{ needs.promote.outputs.rc_tag }}
          LINE: ${{ needs.promote.outputs.line }}
          # True when the PR carries a changelog by EITHER route: preserved on the
          # branch, or generated this run. The PR body must reflect what merged,
          # not just what the AI produced.
          CHANGELOG_PRESENT: ${{ (steps.existing.outputs.present == 'true' || steps.usable.outputs.present == 'true') && 'true' || 'false' }}
          E2E_VERIFICATION: ${{ needs.promote.outputs.e2e_verification }}
        run: |
          # Target the maintenance line if it exists, else main.
          BASE=main
          if git ls-remote --exit-code --heads origin "release-${LINE}" >/dev/null 2>&1; then
            BASE="release-${LINE}"
          fi
          # State the changelog outcome in the PR body: generation is non-blocking,
          # so a missing changelog must be visible where the reviewer is looking.
          # finalize reads this file to populate the published release body — if it
          # is absent at merge, the release ships with empty notes.
          if [ "${CHANGELOG_PRESENT}" = "true" ]; then
            CHANGELOG_NOTE="✅ Includes \`docs/changelogs/v${STABLE_VERSION}.md\`, which finalize uses verbatim as the published release body."
          else
            CHANGELOG_NOTE="⚠️ **No changelog in this PR** — automatic generation failed. Commit \`docs/changelogs/v${STABLE_VERSION}.md\` to this branch before merging, or \`${STABLE_TAG}\` publishes with an empty release body."
          fi
          if [ "${E2E_VERIFICATION}" = "verified" ]; then
            E2E_NOTE="✅ RC full e2e was verified for \`${RC_TAG}\` before promotion."
          else
            E2E_NOTE="⚠️ **RC e2e gate bypassed** — this promotion did not verify green full e2e evidence for \`${RC_TAG}\`."
          fi
          BODY="Promotes \`${RC_TAG}\` to stable \`${STABLE_TAG}\` — no rebuild. The tree pins the rc's images by digest. On merge, pull-requests-release.yaml creates the write-once \`${STABLE_TAG}\` tag at the merge commit, retags those digests to \`${STABLE_TAG}\` (+\`:latest\` when this is the newest stable), publishes the stable cozy-installer chart, and publishes the release — so the stable artifacts are bit-for-bit the rc that passed e2e. Do NOT squash-merge (decision B): the stable tag must attach to a real merge commit.

          ${E2E_NOTE}

          ℹ️ E2E already ran against the immutable rc, so this promote PR does not run E2E by default. A maintainer may add the \`full-e2e\` label to run the full suite again.

          ${CHANGELOG_NOTE}"
          # `gh pr view <branch>` resolves CLOSED PRs too. After a promote PR was
          # closed unmerged and the rc re-dispatched, editing that dead PR would
          # "succeed" and no new PR would ever be opened — the promotion reports
          # success and produces nothing. Branch on the state explicitly.
          PR_STATE="$(gh pr view "${STABLE_BRANCH}" --json state --jq .state 2>/dev/null || echo "")"
          if [ "${PR_STATE}" = "OPEN" ]; then
            # Refresh only while the body is still the one this workflow wrote.
            # docs/release.md tells reviewers to paste upstream breaking-change
            # notes into this body before merge; a re-dispatch that overwrites it
            # would destroy that with no trace and no way to recover it.
            CURRENT="$(gh pr view "${STABLE_BRANCH}" --json body --jq .body 2>/dev/null || echo "")"
            if [ "${CURRENT}" = "${BODY}" ]; then
              echo "PR already open for ${STABLE_BRANCH} with an identical body; nothing to do."
            elif printf '%s' "${CURRENT}" | grep -qF 'Promotes `'; then
              echo "::notice::Refreshing the body of the open PR for ${STABLE_BRANCH}."
              gh pr edit "${STABLE_BRANCH}" --body "$BODY"
            else
              echo "::warning::The open PR for ${STABLE_BRANCH} has a hand-edited body — leaving it untouched. Changelog status this run: ${CHANGELOG_PRESENT}."
            fi
          else
            # Release-labelled promote PRs deliberately omit full-e2e: the rc
            # gate above already checked the immutable candidate. Adding the
            # label later is the explicit maintainer opt-in for a repeat run.
            gh pr create --base "$BASE" --head "${STABLE_BRANCH}" \
              --title "chore(release): promote ${RC_TAG} -> ${STABLE_TAG}" \
              --body "$BODY" --label release
          fi
